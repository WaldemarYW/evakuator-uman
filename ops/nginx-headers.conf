server {
  # Example snippet for evakuator-vezu-nesu.com
  # Replace server_name/root with your actual values.
  server_name evakuator-vezu-nesu.com www.evakuator-vezu-nesu.com;

  # Security headers (start HSTS low, raise after verification)
  add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://googleads.g.doubleclick.net https://www.googleadservices.com; img-src 'self' data: https://www.google.com https://www.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; frame-src https://www.googletagmanager.com https://www.google.com https://googleads.g.doubleclick.net; upgrade-insecure-requests" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Cache static assets aggressively (works with ?v=... cache busting)
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.html$ {
    add_header Cache-Control "max-age=0, must-revalidate" always;
  }
}
